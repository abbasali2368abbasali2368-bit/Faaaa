name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify active Java version
        run: |
          java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Release ${RELEASE_TAG}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          ASSET_NAME="app-debug-${RELEASE_TAG}.apk"

          cp "$APK_PATH" "./$ASSET_NAME"

          gh release create "$RELEASE_TAG" "./$ASSET_NAME" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "Automated release build for commit ${GITHUB_SHA} (Run #${GITHUB_RUN_NUMBER}, Attempt #${GITHUB_RUN_ATTEMPT}). Download the APK directly from the Assets section below."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="app-debug-${RELEASE_TAG}.apk"

          if [ "${{ steps.release.outcome }}" = "success" ]; then
            echo "=================================================="
            echo "Release Publishing Succeeded!"
            echo "=================================================="
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            RELEASE_TITLE=$(gh release view "$RELEASE_TAG" --json name -q .name)

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            echo "### Release Published Successfully :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** \`${RELEASE_TAG}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Title:** ${RELEASE_TITLE}" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page:** [View Release](${RELEASE_URL})" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct APK Asset:** \`${ASSET_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded directly from the **Assets** section of the [GitHub Release](${RELEASE_URL})." >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup under Workflow run artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing failed or was skipped, but the APK build and artifact upload succeeded."
            echo "APK build succeeded: app/build/outputs/apk/debug/app-debug.apk"
            echo "Actions artifact 'app-debug-apk' remains available for download."

            echo "### :warning: Release Publishing Warning" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **Note:** GitHub Release publishing did not succeed or was skipped, but the **APK build and Actions artifact upload succeeded**." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- The debug APK was compiled successfully." >> $GITHUB_STEP_SUMMARY
            echo "- The Actions artifact named **\`app-debug-apk\`** remains available for download under the workflow run summary." >> $GITHUB_STEP_SUMMARY
            echo "- No release URL was published." >> $GITHUB_STEP_SUMMARY
          fi
